<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden}
  .main{width:75%;height:100%;background:var(--brand-primary);display:flex;align-items:center;justify-content:center;padding:0 90px}
  .main img{width:100%;max-width:760px;height:auto;filter:brightness(0) invert(1)}
  .strip{width:25%;height:100%;display:flex;flex-direction:column}
  .strip span{flex:1;display:block}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><img src="assets/logo/pride-in-turf-logo.png" alt="Pride In Turf"></div>
  <div class="strip">
    <span style="background:var(--color-orange-500)"></span>
    <span style="background:var(--color-green-700)"></span>
    <span style="background:var(--color-neutral-900)"></span>
  </div>
</div>
</body>
</html>
