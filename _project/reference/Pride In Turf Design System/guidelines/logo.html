<!-- @dsCard group="Brand" viewport="700x260" name="Logotype" subtitle="Only brand mark provided — use on white/light backgrounds only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px 24px; background: var(--surface-card); box-sizing:border-box; }
  * { box-sizing: border-box; }
  .swatch-label { font-family: var(--font-body); font-size:11px; color: var(--text-secondary); line-height:1.4; }
  .swatch-label b { color: var(--text-primary); display:block; font-weight:var(--weight-semibold); }
  
</style>
</head>
<body>

  <div style="display:flex; gap:16px; height:100%; align-items:stretch;">
    <div style="flex:2; background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-lg); display:flex; align-items:center; justify-content:center; padding:16px;">
      <img src="../assets/logo/pride-in-turf-logo.png" alt="Pride In Turf" style="width:100%; max-width:340px;">
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:10px; justify-content:center;">
      <div class="swatch-label"><b>Full color, transparent PNG</b>Black outline + black tagline pill — needs a light/white surface for contrast.</div>
      <div class="swatch-label"><b>Min width</b>~120px before the tagline clips.</div>
      <div class="swatch-label"><b>Do not</b>place on dark or busy photographic backgrounds, recolor, or drop the outline.</div>
    </div>
  </div>
  
</body>
</html>
