<!-- @dsCard group="Effects" viewport="700x170" name="Corner radius" subtitle="Moderate throughout — not print-sharp, not bubble-soft" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px 24px; background: var(--surface-card); box-sizing:border-box; }
  * { box-sizing: border-box; }
  .swatch-label { font-family: var(--font-body); font-size:11px; color: var(--text-secondary); line-height:1.4; }
  .swatch-label b { color: var(--text-primary); display:block; font-weight:var(--weight-semibold); }
  
</style>
</head>
<body>

  <div style="display:flex; gap:16px; height:100%; align-items:center;">
    
    <div style="flex:1; display:flex; flex-direction:column; gap:8px; align-items:center;">
      <div style="width:64px; height:64px; background:var(--color-green-100); border:1.5px solid var(--color-green-600); border-radius:var(--radius-sm);"></div>
      <div class="swatch-label" style="text-align:center;">--radius-sm<br>6px</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:8px; align-items:center;">
      <div style="width:64px; height:64px; background:var(--color-green-100); border:1.5px solid var(--color-green-600); border-radius:var(--radius-md);"></div>
      <div class="swatch-label" style="text-align:center;">--radius-md<br>10px</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:8px; align-items:center;">
      <div style="width:64px; height:64px; background:var(--color-green-100); border:1.5px solid var(--color-green-600); border-radius:var(--radius-lg);"></div>
      <div class="swatch-label" style="text-align:center;">--radius-lg<br>16px</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:8px; align-items:center;">
      <div style="width:64px; height:64px; background:var(--color-green-100); border:1.5px solid var(--color-green-600); border-radius:var(--radius-xl);"></div>
      <div class="swatch-label" style="text-align:center;">--radius-xl<br>24px</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:8px; align-items:center;">
      <div style="width:64px; height:64px; background:var(--color-green-100); border:1.5px solid var(--color-green-600); border-radius:var(--radius-full);"></div>
      <div class="swatch-label" style="text-align:center;">--radius-full<br>999px</div>
    </div>
  </div>
  
</body>
</html>
