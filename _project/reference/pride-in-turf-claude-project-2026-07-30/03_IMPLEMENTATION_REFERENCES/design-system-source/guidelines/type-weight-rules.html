<!-- @dsCard group="Type" viewport="700x240" name="Weight usage rules" subtitle="Straight from the brand book (p.7–8)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px 24px; background: var(--surface-card); box-sizing:border-box; }
  * { box-sizing: border-box; }
  .swatch-label { font-family: var(--font-body); font-size:11px; color: var(--text-secondary); line-height:1.4; }
  .swatch-label b { color: var(--text-primary); display:block; font-weight:var(--weight-semibold); }
  
</style>
</head>
<body>

  <div style="height:100%; display:flex; flex-direction:column; justify-content:space-between;">
    <div style="display:flex; align-items:center; gap:14px; opacity:0.55;">
      <span style="font-family:var(--font-display); font-weight:900; font-size:var(--text-xl); color:var(--text-primary); width:180px; white-space:nowrap;">Kanit Black</span>
      <span style="font-family:var(--font-body); font-size:12px; color:var(--color-error-700);">Logo wordmark ONLY — never in UI</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span style="font-family:var(--font-display); font-weight:700; font-size:var(--text-xl); color:var(--text-primary); width:180px; white-space:nowrap;">Kanit Bold</span>
      <span style="font-family:var(--font-body); font-size:12px; color:var(--text-secondary);">Headings, buttons, nav emphasis</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span style="font-family:var(--font-display); font-weight:500; font-size:var(--text-xl); color:var(--text-primary); width:180px; white-space:nowrap;">Kanit Medium</span>
      <span style="font-family:var(--font-body); font-size:12px; color:var(--text-secondary);">Eyebrows, labels, sub-heads</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span style="font-family:var(--font-display); font-weight:400; font-size:var(--text-xl); color:var(--text-primary); width:180px; white-space:nowrap;">Kanit Regular</span>
      <span style="font-family:var(--font-body); font-size:12px; color:var(--text-secondary);">Body copy, forms, fine print</span>
    </div>
  </div>
  
</body>
</html>
