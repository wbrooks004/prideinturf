<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pride In Turf — Marketing Site (Visual Review)</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js?v=1783859219073"></script>
<script src="siteData.js"></script>
<style>
  body { margin: 0; background: var(--surface-page); }
  * { box-sizing: border-box; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  @page { size: letter landscape; margin: 0; }

  .print-page { break-after: page; page-break-after: always; overflow: visible; }
  .print-page:last-child { break-after: auto; page-break-after: auto; }

  .screen-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #9a9a9a;
    background: #fff;
    padding: 8px 20px;
    border-bottom: 1px dashed #ddd;
  }

  @media print {
    header { position: static !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="ProgramPage.jsx"></script>
<script type="text/babel" src="ServicePage.jsx"></script>
<script type="text/babel" src="ContactPage.jsx"></script>
<script type="text/babel" src="AboutPage.jsx"></script>
<script type="text/babel" src="ClientPortalPage.jsx"></script>
<script type="text/babel">
const { NavBar, Footer } = window.PrideInTurfDesignSystem_2d4922;
const data = window.SITE_DATA;
const noop = () => {};

const logo = <img src="../../assets/logo/pride-in-turf-logo.png" alt="Pride In Turf" style={{ height: '34px' }} />;
const footerLogo = (
  <span style={{ fontFamily: 'var(--font-display)', fontWeight: 'var(--weight-bold)', fontSize: 'var(--text-xl)', color: 'var(--text-on-dark)' }}>
    PRIDE <span style={{ color: 'var(--brand-accent)' }}>in</span> TURF
  </span>
);

function Screen({ label, path, children }) {
  return (
    <div className="print-page">
      <div className="screen-label">{label} — {path}</div>
      <NavBar logo={logo} links={data.nav} activeHref={path} onCtaClick={noop} />
      {children}
      <Footer
        logo={footerLogo}
        programLinks={data.programs.map((p) => ({ href: p.href, label: p.title }))}
        phone={data.contact.phone}
        email={data.contact.email}
        address={data.contact.locations[0].address}
      />
    </div>
  );
}

function ReviewDoc() {
  return (
    <div>
      <Screen label="Home" path="/">
        <HomePage onNavigate={noop} />
      </Screen>
      <Screen label="About" path="/about/">
        <AboutPage onNavigate={noop} />
      </Screen>
      <Screen label="Lawn Care — program detail" path={data.programs[0].href}>
        <ProgramPage program={data.programs[0]} onNavigate={noop} />
      </Screen>
      <Screen label="Lawn Services — service detail" path={data.services[0].href}>
        <ServicePage service={data.services[0]} onNavigate={noop} />
      </Screen>
      <Screen label="Contact — quote request" path="/contact/">
        <ContactPage />
      </Screen>
      <Screen label="Client Portal" path="/client-portal/">
        <ClientPortalPage />
      </Screen>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ReviewDoc />);
</script>
<script>
addEventListener('load', () => {
  (async () => {
    try { await document.fonts.ready; } catch (e) {}
    let tries = 0;
    while (document.querySelectorAll('.print-page').length < 6 && tries < 100) {
      await new Promise((r) => setTimeout(r, 100));
      tries++;
    }
    const imgs = Array.from(document.images).filter((i) => !i.complete);
    await Promise.race([
      Promise.allSettled(imgs.map((i) => i.decode())),
      new Promise((r) => setTimeout(r, 8000)),
    ]);
    setTimeout(() => window.print(), 500);
  })();
});
</script>
</body>
</html>
