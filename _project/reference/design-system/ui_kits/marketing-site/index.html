<script>
// Resolver for images referenced as strings inside JSX (invisible to the
// static bundler). Live: window.__resources is empty, so this returns the
// original relative path unchanged. Standalone: the bundler populates
// window.__resources[id] with inlined blob URLs, keyed by filename stem.
window.__img = function (path) {
  if (!path) return path;
  var m = String(path).match(/([^\/]+)\.(jpe?g|png|webp)$/i);
  if (m && window.__resources) {
    var hit = window.__resources['img-' + m[1]];
    if (hit) return hit;
  }
  return path;
};
</script>
