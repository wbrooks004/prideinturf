<!-- @dsCard group="Colors" viewport="700x190" name="Brand colors" subtitle="Pinned exactly from the brand book — 4 flag colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px 24px; background: var(--surface-card); box-sizing:border-box; }
  * { box-sizing: border-box; }
  .swatch-label { font-family: var(--font-body); font-size:11px; color: var(--text-secondary); line-height:1.4; }
  .swatch-label b { color: var(--text-primary); display:block; font-weight:var(--weight-semibold); }
  
</style>
</head>
<body>

  <div style="display:flex; gap:14px; height:100%;">
    
    <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
      <div style="height:90px; border-radius:var(--radius-lg); background:#76bc43; border:1px solid var(--border-default);"></div>
      <div class="swatch-label"><b>Green</b>#76bc43<br>rgb(76, 188, 67)</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
      <div style="height:90px; border-radius:var(--radius-lg); background:#f69622; border:1px solid var(--border-default);"></div>
      <div class="swatch-label"><b>Orange</b>#f69622<br>rgb(246, 150, 34)</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
      <div style="height:90px; border-radius:var(--radius-lg); background:#231f20; border:1px solid var(--border-default);"></div>
      <div class="swatch-label"><b>Ink</b>#231f20<br>rgb(35, 31, 32)</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
      <div style="height:90px; border-radius:var(--radius-lg); background:#ffffff; border:1px solid var(--border-default);"></div>
      <div class="swatch-label"><b>White</b>#ffffff<br>rgb(255, 255, 255)</div>
    </div>
  </div>
  
</body>
</html>
